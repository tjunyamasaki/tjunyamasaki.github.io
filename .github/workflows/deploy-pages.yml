name: Deploy GitHub Pages

on:
  push:
    branches: [games-tracker]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write Firebase config from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: python3 .github/scripts/write_firebase_config.py

      - uses: actions/configure-pages@v5

      - name: Stage site (no .git)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r lobby _site/lobby
          cp -r fodinha _site/fodinha
          if [ -d presidente ]; then cp -r presidente _site/presidente; fi
          if [ -d table-tennis ]; then cp -r table-tennis _site/table-tennis; fi
          cp -r game-of-life _site/game-of-life
          cp -r css _site/css
          cp -r js _site/js
          cp -r assets _site/assets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
