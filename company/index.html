<!DOCTYPE html>
<html lang="en" class="look-a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Deep Company</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      (function () {
        try {
          var look = localStorage.getItem("company.look.v1");
          if (look === "a" || look === "b" || look === "c") {
            document.documentElement.classList.remove("look-a", "look-b", "look-c");
            document.documentElement.classList.add("look-" + look);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <svg class="svg-defs" aria-hidden="true" focusable="false">
      <filter id="dungeon-noise" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4" result="n">
          <animate attributeName="baseFrequency" values="0.75;1.1;0.75" dur="6s" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" />
      </filter>
      <radialGradient id="hole-glow" cx="50%" cy="42%" r="62%">
        <stop class="hole-0" offset="0" />
        <stop class="hole-1" offset="0.48" />
        <stop class="hole-2" offset="1" />
      </radialGradient>
      <radialGradient id="seal-wax" cx="42%" cy="32%" r="72%">
        <stop class="wax-0" offset="0" />
        <stop class="wax-1" offset="0.55" />
        <stop class="wax-2" offset="1" />
      </radialGradient>
    </svg>

    <div class="scene" id="scene">
      <div class="poster" aria-hidden="true">
        <span class="wall wall-l"></span>
        <span class="wall wall-r"></span>
        <span class="moss moss-a"></span>
        <span class="moss moss-b"></span>
        <span class="torch torch-l"></span>
        <span class="torch torch-r"></span>
        <span class="brass brass-tl"></span>
        <span class="brass brass-tr"></span>
        <span class="brass brass-bl"></span>
        <span class="brass brass-br"></span>
        <span class="grain"></span>
        <span class="tiles"></span>
      </div>

      <a class="hub-back" href="/links/">Games</a>

      <header class="hud">
        <div class="title-block">
          <p class="kicker" id="kicker">Torch dungeon</p>
          <h1 class="title">Deep Company</h1>
          <div class="look-switch" role="radiogroup" aria-label="Look">
            <button type="button" class="look-btn" data-look="a" aria-pressed="true">A Torch</button>
            <button type="button" class="look-btn" data-look="b" aria-pressed="false">B Bestiary</button>
            <button type="button" class="look-btn" data-look="c" aria-pressed="false">C JRPG</button>
          </div>
        </div>
        <div
          class="air-sticker"
          id="air"
          role="progressbar"
          aria-label="Air"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span class="air-label">Air</span>
          <svg class="air-enso" viewBox="0 0 48 48" aria-hidden="true">
            <circle class="air-track" cx="24" cy="24" r="16" />
            <circle class="air-fill" id="air-fill" cx="24" cy="24" r="16" pathLength="100" />
          </svg>
          <span class="air-hp"><i class="air-hp-fill"></i></span>
        </div>
      </header>

      <div class="toast" id="toast" hidden>
        <p class="toast-kicker" id="toast-kicker"></p>
        <p class="toast-name" id="toast-name"></p>
      </div>

      <div class="stage" id="stage">
        <div class="familiar-perch">
          <p class="familiar-plate" id="familiar-plate">Imp-slime</p>
          <svg class="familiar" id="familiar" viewBox="0 0 160 180" role="img" aria-label="Familiar">
            <g class="familiar-bob">
              <ellipse class="glow-aura" cx="80" cy="108" rx="60" ry="50" />
              <g class="ribbon">
                <path class="wing wing-l" d="M46 96 C10 86 2 44 38 54 C16 74 22 112 52 114 Z" />
                <path class="wing wing-r" d="M114 96 C150 86 158 44 122 54 C144 74 138 112 108 114 Z" />
              </g>
              <path class="horn" d="M70 46 L80 8 L92 46 Z" />

              <g class="body-round">
                <path class="ear ear-l" d="M44 72 L24 38 L62 64 Z" />
                <path class="ear ear-r" d="M116 72 L136 38 L98 64 Z" />
                <ellipse class="leg leg-l" cx="56" cy="154" rx="16" ry="12" />
                <ellipse class="leg leg-r" cx="106" cy="154" rx="16" ry="12" />
                <ellipse class="body" cx="80" cy="108" rx="52" ry="46" />
                <ellipse class="belly" cx="80" cy="120" rx="30" ry="22" />
                <g class="hatch">
                  <path d="M58 108 L72 142" />
                  <path d="M70 104 L84 140" />
                  <path d="M82 104 L94 138" />
                  <path d="M94 108 L104 136" />
                </g>
                <g class="fangs">
                  <polygon points="68,128 64,142 74,132" />
                  <polygon points="92,128 86,132 96,142" />
                </g>
                <path class="mouth" d="M64 128 Q80 138 96 128" />
                <g class="eye eye-main">
                  <ellipse class="eye-white" cx="66" cy="92" rx="15" ry="16" />
                  <circle class="pupil" cx="70" cy="96" r="7" />
                  <circle class="glint" cx="74" cy="90" r="2.4" />
                </g>
                <g class="eye eye-extra">
                  <ellipse class="eye-white" cx="104" cy="86" rx="11" ry="13" />
                  <circle class="pupil" cx="107" cy="90" r="5.2" />
                  <circle class="glint" cx="110" cy="84" r="2" />
                </g>
              </g>

              <g class="body-chunk">
                <rect class="pixel-foot pixel-foot-l" x="46" y="136" width="28" height="18" rx="2" />
                <rect class="pixel-foot pixel-foot-r" x="86" y="136" width="28" height="18" rx="2" />
                <rect class="pixel-arm pixel-arm-l" x="26" y="88" width="24" height="22" rx="2" />
                <rect class="pixel-arm pixel-arm-r" x="110" y="88" width="24" height="22" rx="2" />
                <rect class="pixel-body" x="48" y="78" width="64" height="58" rx="3" />
                <rect class="belly" x="62" y="92" width="36" height="30" rx="2" />
                <rect class="pixel-head" x="46" y="30" width="68" height="54" rx="3" />
                <g class="fangs">
                  <rect x="64" y="66" width="8" height="12" />
                  <rect x="88" y="66" width="8" height="12" />
                </g>
                <path class="mouth" d="M62 64 H98" />
                <g class="eye eye-main">
                  <ellipse class="eye-white" cx="66" cy="52" rx="12" ry="12" />
                  <circle class="pupil" cx="70" cy="56" r="6" />
                  <circle class="glint" cx="73" cy="50" r="2.2" />
                </g>
                <g class="eye eye-extra">
                  <ellipse class="eye-white" cx="102" cy="48" rx="10" ry="11" />
                  <circle class="pupil" cx="105" cy="52" r="5" />
                  <circle class="glint" cx="108" cy="46" r="1.8" />
                </g>
              </g>
              <ellipse class="drip" cx="50" cy="148" rx="5" ry="8" />
            </g>
          </svg>
        </div>

        <div class="well-wrap" id="well-wrap">
          <svg class="enso" viewBox="0 0 240 240" aria-hidden="true">
            <circle class="enso-track" cx="120" cy="120" r="108" />
            <circle class="enso-fill" id="enso-fill" cx="120" cy="120" r="108" pathLength="100" />
          </svg>
          <button type="button" class="well" id="well" aria-label="Delve the pit">
            <svg class="well-art" viewBox="0 0 240 240" aria-hidden="true">
              <g class="look-art look-art-a">
                <ellipse class="ring-a" cx="120" cy="130" rx="106" ry="88" />
                <path class="seam" d="M24 116 Q120 72 216 116" />
                <path class="seam" d="M30 152 Q120 196 210 152" />
                <path class="seam-v" d="M68 64 L62 96" />
                <path class="seam-v" d="M170 66 L176 98" />
                <path class="seam-v" d="M120 44 L120 62" />
                <ellipse class="ring-b" cx="120" cy="132" rx="84" ry="68" />
                <ellipse class="ring-c" cx="120" cy="136" rx="62" ry="50" />
                <ellipse class="moss-blob" cx="46" cy="112" rx="18" ry="10" />
                <ellipse class="moss-blob" cx="198" cy="140" rx="14" ry="8" />
                <ellipse class="gullet" cx="120" cy="144" rx="42" ry="32" filter="url(#dungeon-noise)" />
                <ellipse class="gullet-core" cx="122" cy="152" rx="18" ry="12" />
                <g class="grate">
                  <rect x="88" y="130" width="5" height="30" />
                  <rect x="106" y="128" width="5" height="34" />
                  <rect x="124" y="128" width="5" height="34" />
                  <rect x="142" y="130" width="5" height="30" />
                </g>
                <g class="rim-torch" transform="translate(202 70)">
                  <rect class="torch-pole" x="-3.5" y="10" width="7" height="24" rx="1" />
                  <ellipse class="flame" cx="0" cy="4" rx="8" ry="14" />
                </g>
                <g class="delver" transform="translate(168 58)">
                  <circle class="delver-head" cx="0" cy="0" r="8" />
                  <path class="delver-body" d="M-6 9 Q0 26 7 11" />
                  <path class="delver-leg" d="M-2 22 L-8 36" />
                  <path class="delver-leg" d="M4 22 L10 34" />
                </g>
              </g>

              <g class="look-art look-art-b">
                <rect class="slab" x="22" y="28" width="196" height="188" rx="10" />
                <circle class="summon-outer" cx="120" cy="124" r="86" />
                <circle class="summon-mid" cx="120" cy="124" r="62" />
                <circle class="summon-inner" cx="120" cy="124" r="38" />
                <path class="sigil" d="M120 78 L156 148 L84 148 Z" />
                <g class="ticks">
                  <path d="M120 30 L120 46" />
                  <path d="M120 202 L120 186" />
                  <path d="M28 124 L44 124" />
                  <path d="M212 124 L196 124" />
                </g>
                <ellipse class="gullet" cx="120" cy="128" rx="28" ry="22" filter="url(#dungeon-noise)" />
                <ellipse class="gullet-core" cx="121" cy="134" rx="12" ry="9" />
                <g class="candles">
                  <rect class="stub" x="54" y="46" width="8" height="16" />
                  <ellipse class="flame" cx="58" cy="42" rx="5" ry="9" />
                  <rect class="stub" x="178" y="46" width="8" height="16" />
                  <ellipse class="flame" cx="182" cy="42" rx="5" ry="9" />
                </g>
              </g>

              <g class="look-art look-art-c">
                <g class="floor-tiles">
                  <rect x="8" y="16" width="56" height="52" />
                  <rect x="64" y="16" width="56" height="52" />
                  <rect x="120" y="16" width="56" height="52" />
                  <rect x="176" y="16" width="56" height="52" />
                  <rect x="8" y="68" width="56" height="52" />
                  <rect x="176" y="68" width="56" height="52" />
                  <rect x="8" y="120" width="56" height="52" />
                  <rect x="176" y="120" width="56" height="52" />
                  <rect x="8" y="172" width="56" height="52" />
                  <rect x="64" y="172" width="56" height="52" />
                  <rect x="120" y="172" width="56" height="52" />
                  <rect x="176" y="172" width="56" height="52" />
                </g>
                <rect class="stair stair-1" x="40" y="52" width="160" height="136" />
                <rect class="stair stair-2" x="56" y="66" width="128" height="112" />
                <rect class="stair stair-3" x="72" y="80" width="96" height="88" />
                <rect class="stair stair-4" x="88" y="94" width="64" height="64" />
                <rect class="gullet-core hole-sq" x="100" y="108" width="40" height="40" />
                <g class="delver" transform="translate(78 70)">
                  <rect class="delver-head" x="-7" y="-8" width="14" height="12" />
                  <rect class="pixel-body" x="-6" y="4" width="12" height="16" />
                </g>
              </g>
            </svg>
            <span class="well-label"></span>
          </button>
        </div>
      </div>

      <canvas id="fx" aria-hidden="true"></canvas>

      <footer class="dock">
        <button type="button" class="surface" id="surface">Surface</button>
      </footer>

      <div class="pit" id="pit" hidden>
        <div class="pit-veil"></div>
        <div class="wrestle" aria-hidden="true">
          <span class="speed-lines"></span>
          <span class="pit-torch pit-torch-l"></span>
          <span class="pit-torch pit-torch-r"></span>
          <span class="brass brass-tl"></span>
          <span class="brass brass-tr"></span>
          <span class="brass brass-bl"></span>
          <span class="brass brass-br"></span>
          <span class="plate-caption">Plate XII · Duel</span>
        </div>
        <div class="pit-fighters">
          <div class="pit-hero" id="pit-hero"></div>
          <div class="pit-ghost" id="pit-ghost"></div>
        </div>
        <div class="slapstick" id="slapstick" aria-hidden="true">
          <svg class="rock" viewBox="0 0 64 48">
            <path d="M8 30 L18 12 L40 8 L58 22 L50 42 L16 44 Z" />
          </svg>
          <span class="ice ice-a"></span>
          <span class="ice ice-b"></span>
          <span class="ice ice-c"></span>
        </div>
        <p class="pit-call" id="pit-call">Clash</p>
        <div class="battle-window" aria-hidden="true">
          <p class="battle-msg">A ghost blocks the stairs!</p>
          <ul class="battle-cmds">
            <li class="is-sel">Fight</li>
            <li>Item</li>
            <li>Run</li>
          </ul>
        </div>
      </div>

      <div class="stamp" id="stamp" hidden>
        <svg class="seal" viewBox="0 0 120 120" aria-hidden="true">
          <path class="wax" d="M18 52 C14 28 36 10 60 14 C88 8 110 30 106 54 C118 70 102 98 74 106 C52 118 22 102 18 78 C8 70 12 60 18 52 Z" />
          <circle class="gold-rim" cx="60" cy="60" r="32" />
          <circle class="gold-inner" cx="60" cy="60" r="24" />
          <path class="mark" d="M44 72 Q60 38 76 72 M50 60 H70" />
        </svg>
        <p class="stamp-word">Claimed</p>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
