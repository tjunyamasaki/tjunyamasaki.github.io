<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Eye of the Deep</title>
  <desc>A torn-out violet eye with a slit pupil, veined and dripping dark tendrils, staring.</desc>
  <g stroke="#2b2233" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tendrils hanging from it. -->
    <path d="M86 196Q70 236 88 262Q96 278 84 292M120 204Q126 246 112 290M154 196Q172 230 158 258Q150 276 162 290" fill="none" stroke-width="15"/>
    <path d="M86 196Q70 236 88 262Q96 278 84 292M120 204Q126 246 112 290M154 196Q172 230 158 258Q150 276 162 290" fill="none" stroke="#4a2c52" stroke-width="8"/>
    <!-- Halo of dark. -->
    <circle cx="120" cy="120" r="104" fill="#1c1030" stroke-width="6"/>
    <!-- The eyeball. -->
    <circle cx="120" cy="120" r="86" fill="#efe6f4" stroke-width="7"/>
    <path d="M44 150Q96 214 192 154Q152 200 104 198Q66 190 44 150Z" fill="#cdbbd8" stroke="none"/>
    <path d="M40 104L70 112L62 92M196 96L170 108L182 88M58 170L82 160L80 180M188 162L164 156L170 178" fill="none" stroke="#c46a8a" stroke-width="4"/>
    <!-- Iris and slit. -->
    <circle cx="124" cy="116" r="46" fill="#7c3cff" stroke-width="6"/>
    <circle cx="124" cy="116" r="30" fill="#b45cff" stroke="none"/>
    <path d="M124 76Q140 116 124 156Q108 116 124 76Z" fill="#120624" stroke-width="4"/>
    <circle cx="102" cy="96" r="10" fill="#ffffff" stroke="none"/>
    <circle cx="146" cy="138" r="5" fill="#ff9ccf" stroke="none"/>
  </g>
</svg>
