<svg xmlns="http://www.w3.org/2000/svg" width="280" height="360" viewBox="0 0 280 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Gloomgrasp Scepter</title>
  <desc>A black scepter crowned with a clawed shadow hand clutching a staring violet eye, wreathed in rising shadow flames.</desc>
  <g stroke="#0f0a16" stroke-linejoin="round" stroke-linecap="round">
    <!-- Shadow flames lick up behind the hand; violet rims keep them readable on dark ground. -->
    <path d="M70 214C44 180 76 160 58 118C92 138 100 172 90 214Z" fill="#2a1e3d" stroke-width="7"/>
    <path d="M72 200C62 180 74 166 68 146C84 162 86 184 82 200Z" fill="#6d44c9" stroke="none"/>
    <path d="M206 196C232 160 204 132 222 92C188 114 180 154 188 196Z" fill="#2a1e3d" stroke-width="7"/>
    <path d="M204 184C214 162 204 142 212 124C196 140 194 164 196 184Z" fill="#6d44c9" stroke="none"/>
    <path d="M48 96C38 80 52 68 46 52C62 64 64 82 58 96Z" fill="#2a1e3d" stroke-width="5"/>
    <!-- Iron-black shaft bound in a violet spiral, ending in a spike. -->
    <rect x="129" y="186" width="22" height="146" rx="9" fill="#2e2340" stroke-width="7"/>
    <path d="M129 212L151 224M129 244L151 256M129 276L151 288M129 308L151 320" fill="none" stroke-width="9"/>
    <path d="M129 212L151 224M129 244L151 256M129 276L151 288M129 308L151 320" fill="none" stroke="#8a5cff" stroke-width="4"/>
    <path d="M135 196L135 324" fill="none" stroke="#4b3572" stroke-width="4"/>
    <path d="M128 330L152 330L140 356Z" fill="#3b2a57" stroke-width="6"/>
    <!-- Violet halo and the staring eye the hand clutches. -->
    <circle cx="140" cy="96" r="46" fill="#8a5cff" opacity=".22" stroke="none"/>
    <circle cx="140" cy="96" r="34" fill="#f3e8ff" stroke-width="8"/>
    <circle cx="140" cy="98" r="21" fill="#8a5cff" stroke-width="5"/>
    <circle cx="140" cy="98" r="14" fill="#ff4fd8" stroke="none"/>
    <ellipse cx="140" cy="98" rx="5" ry="14" fill="#0f0a16" stroke="none"/>
    <circle cx="131" cy="89" r="5" fill="#ffffff" stroke="none"/>
    <path d="M118 74Q126 66 138 64" fill="none" stroke="#ffffff" stroke-width="4"/>
    <!-- Palm and bone-silver cuff joining the hand to the shaft. -->
    <path d="M102 148Q98 180 124 188L156 188Q182 180 178 148Q140 134 102 148Z" fill="#2a1e3d" stroke-width="8"/>
    <path d="M112 156Q140 146 168 156" fill="none" stroke="#8a5cff" stroke-width="4"/>
    <rect x="116" y="182" width="48" height="15" rx="6" fill="#d9cdf0" stroke-width="6"/>
    <path d="M126 189L154 189" fill="none" stroke="#8a5cff" stroke-width="4"/>
    <!-- Four long clawed fingers wrap up and over the eye. -->
    <g fill="none">
      <path d="M112 150C84 132 86 88 102 64" stroke-width="24"/>
      <path d="M128 144C110 118 112 76 124 54" stroke-width="22"/>
      <path d="M152 144C170 118 168 78 156 54" stroke-width="22"/>
      <path d="M168 150C196 132 194 90 178 66" stroke-width="24"/>
      <path d="M112 150C84 132 86 88 102 64" stroke="#2a1e3d" stroke-width="15"/>
      <path d="M128 144C110 118 112 76 124 54" stroke="#2a1e3d" stroke-width="13"/>
      <path d="M152 144C170 118 168 78 156 54" stroke="#2a1e3d" stroke-width="13"/>
      <path d="M168 150C196 132 194 90 178 66" stroke="#2a1e3d" stroke-width="15"/>
      <path d="M104 136C90 120 92 96 100 78M170 136C184 120 184 98 176 80" stroke="#8a5cff" stroke-width="4"/>
      <path d="M121 124C114 106 116 84 122 70M159 124C166 106 164 86 158 70" stroke="#4b3572" stroke-width="4"/>
    </g>
    <circle cx="94" cy="110" r="6" fill="#4b3572" stroke-width="4"/>
    <circle cx="186" cy="112" r="6" fill="#4b3572" stroke-width="4"/>
    <circle cx="116" cy="98" r="5" fill="#4b3572" stroke-width="3"/>
    <circle cx="164" cy="98" r="5" fill="#4b3572" stroke-width="3"/>
    <path d="M96 70L102 54L116 62Z" fill="#e9defc" stroke-width="5"/>
    <path d="M118 60L126 44L138 54Z" fill="#e9defc" stroke-width="5"/>
    <path d="M162 60L154 44L142 54Z" fill="#e9defc" stroke-width="5"/>
    <path d="M184 72L178 56L164 64Z" fill="#e9defc" stroke-width="5"/>
    <!-- The thumb crosses in front, pinning the eye in place. -->
    <path d="M108 170Q110 138 150 130" fill="none" stroke-width="24"/>
    <path d="M108 170Q110 138 150 130" fill="none" stroke="#2a1e3d" stroke-width="15"/>
    <path d="M114 156Q120 142 138 136" fill="none" stroke="#8a5cff" stroke-width="4"/>
    <path d="M146 124L164 126L150 138Z" fill="#e9defc" stroke-width="5"/>
    <!-- Sparkles echo the eye's violet and magenta. -->
    <path d="M40 238L43 246L51 249L43 252L40 260L37 252L29 249L37 246Z" fill="#c9a6ff" stroke-width="3"/>
    <path d="M238 44L240 50L246 52L240 54L238 60L236 54L230 52L236 50Z" fill="#ff4fd8" stroke-width="3"/>
    <path d="M236 236L238 241L243 243L238 245L236 250L234 245L229 243L234 241Z" fill="#8a5cff" stroke-width="3"/>
  </g>
</svg>
