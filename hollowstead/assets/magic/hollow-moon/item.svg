<svg xmlns="http://www.w3.org/2000/svg" width="280" height="360" viewBox="0 0 280 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Hollow Moon</title>
  <desc>A little dead moon with sunken eyes and a gaping violet mouth, hanging over a swirling gravity well, a moonlet circling it.</desc>
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#b69cff" stop-opacity=".7"/><stop offset="1" stop-color="#7d5cff" stop-opacity="0"/></radialGradient>
    <clipPath id="disc"><circle cx="140" cy="146" r="92"/></clipPath>
  </defs>
  <g stroke="#2b2233" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- The well: a violet void and spiral arms under the moon. -->
    <ellipse cx="140" cy="300" rx="118" ry="42" fill="#3b2a78"/>
    <ellipse cx="140" cy="300" rx="52" ry="18" fill="#140a2e"/>
    <path d="M140 300C190 296 214 312 250 300M140 300C90 304 66 288 30 300M140 300C160 318 120 332 96 336M140 300C120 282 160 268 184 264" fill="none" stroke="#b69cff" stroke-width="6"/>
    <path d="M140 300L140 250" stroke="#b69cff" stroke-width="5" stroke-dasharray="4 12" fill="none"/>
    <circle cx="140" cy="146" r="130" fill="url(#glow)" stroke="none"/>
    <!-- The moon: bone-pale lit side, the night side in indigo, craters. -->
    <circle cx="140" cy="146" r="92" fill="#3b3060"/>
    <g clip-path="url(#disc)" stroke="none">
      <path d="M140 54A92 92 0 0 1 140 238A50 92 0 0 0 140 54Z" fill="#f4edd6"/>
      <ellipse cx="196" cy="102" rx="16" ry="12" fill="#cdbf9f"/>
      <ellipse cx="208" cy="186" rx="13" ry="10" fill="#cdbf9f"/>
      <ellipse cx="84" cy="200" rx="18" ry="13" fill="#281f47"/>
      <ellipse cx="80" cy="96" rx="11" ry="9" fill="#281f47"/>
      <path d="M150 58Q142 80 156 96Q168 108 162 124" fill="none" stroke="#2b2233" stroke-width="4"/>
    </g>
    <circle cx="140" cy="146" r="92" fill="none"/>
    <!-- The hollow face. -->
    <ellipse cx="108" cy="128" rx="16" ry="21" fill="#2b2233"/>
    <ellipse cx="172" cy="128" rx="16" ry="21" fill="#2b2233"/>
    <circle cx="108" cy="131" r="6" fill="#b69cff" stroke="none"/>
    <circle cx="172" cy="131" r="6" fill="#b69cff" stroke="none"/>
    <ellipse cx="140" cy="186" rx="32" ry="22" fill="#140a2e"/>
    <ellipse cx="140" cy="190" rx="16" ry="10" fill="#7d5cff" stroke="none"/>
    <path d="M118 172L124 182L130 172M150 172L156 182L162 172" fill="#f4edd6" stroke-width="4"/>
    <!-- A moonlet on its orbit. -->
    <path d="M24 112Q140 58 256 112" fill="none" stroke="#b69cff" stroke-width="4" stroke-dasharray="6 10"/>
    <circle cx="246" cy="104" r="14" fill="#bdb09a"/>
    <circle cx="242" cy="100" r="4" fill="#8f836f" stroke="none"/>
  </g>
</svg>
