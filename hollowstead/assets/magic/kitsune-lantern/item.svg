    <g transform="translate(140 171)">
      <use href="#tail" transform="rotate(-88) scale(.92)" fill="#b88aee"/>
      <use href="#tail" transform="rotate(88) scale(.92)" fill="#b88aee"/>
      <use href="#tail" transform="rotate(-66) scale(.97)" fill="#55d9c3"/>
      <use href="#tail" transform="rotate(66) scale(.97)" fill="#55d9c3"/>
      <use href="#tail" transform="rotate(-44)" fill="#aa7ee0"/>
      <use href="#tail" transform="rotate(44)" fill="#aa7ee0"/>
      <use href="#tail" transform="rotate(-22) scale(1.03)" fill="#55d9c3"/>
      <use href="#tail" transform="rotate(22) scale(1.03)" fill="#55d9c3"/>
      <use href="#tail" transform="scale(1.07)" fill="#b88aee"/>
    </g>
