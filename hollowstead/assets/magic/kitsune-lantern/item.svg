<svg xmlns="http://www.w3.org/2000/svg" width="280" height="360" viewBox="0 0 280 360">
  <title>Nine-Tail Lantern</title>
  <desc>A wicked ivory fox lantern crowned with nine mint and violet foxfire tails, scarlet cords, and a gold bell.</desc>
  <defs>
    <g id="tail" stroke="#2b2233" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 12C-24-10-30-43-21-68C-15-86 3-97 0-132C27-113 36-87 26-62C16-37 9-21 0 12Z"/>
      <path d="M-15-76C-7-91 3-103 0-132C20-116 26-99 25-84L13-94L10-74L0-85Z" fill="#fff1ca" stroke-width="4"/>
      <path d="M-6-35Q-10-53 0-67" fill="none" stroke="#e2fff8" stroke-width="5"/>
    </g>
  </defs>
  <g stroke="#2b2233" stroke-linejoin="round" stroke-linecap="round">
