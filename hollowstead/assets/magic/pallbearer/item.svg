<svg xmlns="http://www.w3.org/2000/svg" width="280" height="360" viewBox="0 0 280 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Pallbearer’s Flail</title>
  <desc>A bone-wrapped grip on a heavy grave-chain ending in a small iron-banded coffin, ghost light leaking from its lid.</desc>
  <g stroke="#2b2233" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- grip -->
    <path d="M58 30 L92 64" stroke-width="30"/>
    <path d="M58 30 L92 64" stroke="#e9dfc9" stroke-width="16"/>
    <path d="M64 44 L78 36 M72 54 L86 46" stroke="#b9ab90" stroke-width="5"/>
    <circle cx="100" cy="74" r="13" fill="#8d89a6"/>
    <!-- chain -->
    <g fill="none">
      <ellipse cx="114" cy="96" rx="10" ry="15" transform="rotate(-38 114 96)" stroke-width="16"/>
      <ellipse cx="114" cy="96" rx="10" ry="15" transform="rotate(-38 114 96)" stroke="#8d89a6" stroke-width="6"/>
      <ellipse cx="128" cy="120" rx="15" ry="9" transform="rotate(-38 128 120)" stroke-width="16"/>
      <ellipse cx="128" cy="120" rx="15" ry="9" transform="rotate(-38 128 120)" stroke="#cfcce2" stroke-width="6"/>
      <ellipse cx="140" cy="146" rx="10" ry="15" transform="rotate(-20 140 146)" stroke-width="16"/>
      <ellipse cx="140" cy="146" rx="10" ry="15" transform="rotate(-20 140 146)" stroke="#8d89a6" stroke-width="6"/>
    </g>
    <!-- coffin -->
    <g transform="rotate(14 160 250)">
      <path d="M130 172 L190 172 L214 206 L196 336 L124 336 L106 206 Z" fill="#34202b"/>
      <path d="M126 164 L186 164 L210 198 L192 326 L120 326 L102 198 Z" fill="#5a3848"/>
      <path d="M132 176 L180 176 L198 202" fill="none" stroke="#7d5268" stroke-width="6"/>
      <path d="M156 186 L156 292 M128 222 L184 222" stroke-width="20"/>
      <path d="M156 186 L156 292 M128 222 L184 222" stroke="#efe6d2" stroke-width="9"/>
      <path d="M112 200 L200 200" stroke-width="18"/>
      <path d="M112 200 L200 200" stroke="#8d89a6" stroke-width="8"/>
      <path d="M118 306 L194 306" stroke-width="18"/>
      <path d="M118 306 L194 306" stroke="#8d89a6" stroke-width="8"/>
      <path d="M102 198 L120 326" stroke="#b8c4ff" stroke-width="5" opacity=".9"/>
      <circle cx="115" cy="250" r="5" fill="#f5f7ff" stroke-width="3"/>
      <circle cx="117" cy="266" r="5" fill="#f5f7ff" stroke-width="3"/>
    </g>
  </g>
