    <path d="M252 162Q214 144 164 130L162 137Q210 151 250 164Z" fill="#cdb48e" stroke="none"/>
    <path d="M160 130Q150 146 128 150Q146 148 160 138Z" fill="#cdb48e" stroke="none"/>
    <path d="M186 101L181 111M206 114L199 122M225 131L217 137" fill="none" stroke-width="4"/>
    <path d="M169 92Q178 114 168 138" fill="none" stroke-width="13"/>
    <path d="M169 92Q178 114 168 138" fill="none" stroke="#e0ab4a" stroke-width="6"/>
    <circle cx="238" cy="150" r="4" fill="#2b2233" stroke="none"/>
    <!-- Brass-ringed lenses glow the same lime as the miasma. -->
    <circle cx="106" cy="104" r="14" fill="#e0ab4a" stroke-width="6"/>
    <circle cx="106" cy="104" r="8" fill="#c8ff5c" stroke="none"/>
    <circle cx="141" cy="104" r="18" fill="#e0ab4a" stroke-width="6"/>
