    <path d="M129 318L151 318L147 349Q140 356 133 349Z" fill="#e0ab4a" stroke-width="6"/>
    <!-- Scalloped cloak collar drapes over the shaft. -->
    <path d="M96 134Q82 160 94 178L110 168L124 184L140 170L156 184L170 168L186 176Q192 154 174 128Q160 150 140 154Q112 152 96 134Z" fill="#4a3560" stroke-width="7"/>
    <path d="M108 160L112 168M140 158L140 168M168 156L166 166" fill="none" stroke="#6b4f86" stroke-width="4"/>
