    <circle cx="238" cy="238" r="17" fill="#c8ff5c" stroke="none"/>
    <path d="M222 232Q238 226 254 232" fill="none" stroke="#8fd65a" stroke-width="4"/>
    <circle cx="238" cy="240" r="7" fill="#f1e6c8" stroke-width="3"/>
    <circle cx="235" cy="239" r="1.8" fill="#2b2233" stroke="none"/>
