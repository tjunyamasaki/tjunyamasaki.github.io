<svg xmlns="http://www.w3.org/2000/svg" width="280" height="360" viewBox="0 0 280 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Plaguebeak Cane</title>
  <desc>A plague doctor's walking cane crowned with a bone-white beak mask, brass-ringed lime lenses, a brimmed hat, and a dangling vial of miasma.</desc>
  <!-- Miasma billows share one ink pass so they read as a single cartoon cloud. -->
  <g fill="#2b2233">
    <circle cx="62" cy="126" r="30"/><circle cx="86" cy="98" r="26"/><circle cx="52" cy="162" r="22"/>
    <circle cx="206" cy="40" r="22"/><circle cx="228" cy="60" r="18"/><circle cx="74" cy="192" r="17"/>
  </g>
  <g fill="#8fd65a">
    <circle cx="62" cy="126" r="24"/><circle cx="86" cy="98" r="20"/><circle cx="52" cy="162" r="16"/>
    <circle cx="206" cy="40" r="16"/><circle cx="228" cy="60" r="12"/><circle cx="74" cy="192" r="11"/>
  </g>
  <g fill="#c8ff5c" opacity=".6">
    <circle cx="54" cy="118" r="8"/><circle cx="80" cy="91" r="7"/><circle cx="200" cy="34" r="5"/><circle cx="47" cy="156" r="5"/>
  </g>
  <g fill="#4fae5c">
    <circle cx="70" cy="136" r="9"/><circle cx="222" cy="66" r="5"/>
  </g>
