    <path d="M130 238C150 222 194 186 206 140C196 182 160 208 138 222Z" fill="#7e1f2a" stroke="none"/>
    <path d="M70 104Q74 80 98 76Q84 92 82 112Z" fill="#f08a7a" stroke="none"/>
    <!-- Arteries on top. -->
    <path d="M112 62Q108 36 92 24M150 62Q156 40 172 30" fill="none" stroke-width="18"/>
    <path d="M112 62Q108 36 92 24M150 62Q156 40 172 30" fill="none" stroke="#a52f36" stroke-width="10"/>
