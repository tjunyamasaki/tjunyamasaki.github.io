<svg xmlns="http://www.w3.org/2000/svg" width="260" height="320" viewBox="0 0 260 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Thornmother’s Heart</title>
  <desc>A swollen crimson heart bound in living briar, thorns bristling, a single green bud breaking from it.</desc>
  <g stroke="#2b2233" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trailing vines below the heart, as if torn from the throne. -->
