    <path d="M50 132Q120 104 210 136M56 170Q130 200 198 162M88 214Q132 150 170 72" fill="none" stroke-width="14"/>
    <path d="M50 132Q120 104 210 136M56 170Q130 200 198 162M88 214Q132 150 170 72" fill="none" stroke="#6b4630" stroke-width="7"/>
    <path d="M78 122L70 104M118 112L116 92M160 116L170 98M196 132L214 122M80 180L70 196M126 190L124 210M176 176L190 190M110 186L96 196M150 120L162 132M138 150L120 146M160 94L178 90" fill="none" stroke="#2b2233" stroke-width="7"/>
    <path d="M78 122L70 104M118 112L116 92M160 116L170 98M196 132L214 122M80 180L70 196M126 190L124 210M176 176L190 190M110 186L96 196M150 120L162 132M138 150L120 146M160 94L178 90" fill="none" stroke="#efe0bd" stroke-width="3"/>
    <!-- A bud breaking out. -->
