<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hollowstead — device preview</title>
<style>body{margin:0;background:#191720;color:#ead7b9;font:13px system-ui}header{padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}header strong{margin-right:auto}button,a{border:1px solid #796650;color:inherit;background:#312b37;padding:9px 13px;border-radius:5px;text-decoration:none;font:inherit;cursor:pointer}main{display:flex;gap:20px;justify-content:center;align-items:start;padding:10px;flex-wrap:wrap}iframe{border:1px solid #796650;border-radius:14px;background:#292532;max-width:100%;box-shadow:0 12px 50px #0006}small{color:#b5a68e}</style>
<header><strong>Hollowstead · device preview</strong><button data-size="phone">Phone</button><button data-size="landscape">Landscape</button><button data-size="coop">Two-player preview</button><a href="./">Open game ↗</a><small>Resizing preserves the first expedition.</small></header><main><iframe id="first" title="Primary game preview" src="./?preview=phone" width="390" height="780" allow="clipboard-write; autoplay"></iframe></main>
<script>const first=document.querySelector('#first');for(const button of document.querySelectorAll('[data-size]'))button.onclick=()=>{const kind=button.dataset.size;first.width=kind==='landscape'?852:390;first.height=kind==='landscape'?393:780;let second=document.querySelector('#second');if(kind==='coop'&&!second){second=document.createElement('iframe');second.id='second';second.title='Guest game preview';second.src='./?preview=guest';second.width=390;second.height=780;second.allow='clipboard-write; autoplay';document.querySelector('main').append(second);}else if(kind!=='coop'&&second)second.remove();};</script></html>
