<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollowstead - Yomi art set</title>
<style>
:root{--bg:#302d3c;--ground:#7d735d;--card:#3a3647;--ink:#efe6cf;--dim:#b9b0c8;--accent:#eaaa6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 14px;color:var(--dim)}
#stage{width:100%;max-width:1200px;display:block;border-radius:12px;background:var(--ground);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;max-width:1200px}
.card{background:var(--card);border-radius:12px;padding:10px}.card canvas{width:100%;background:var(--ground);border-radius:8px;display:block}
.card b{display:block;margin:8px 0 6px}.chips{display:flex;flex-wrap:wrap;gap:6px}
button{background:#4a4559;color:var(--ink);border:0;border-radius:99px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
button.on{background:var(--accent);color:#2b2233}
</style></head><body>
<h1>Yomi art set</h1><p>Art only, generated by tools/art/yomi.py. Sprites are drawn at their world size from sprites.json.</p>
<canvas id="stage" width="1200" height="430"></canvas>
<div class="grid" id="grid"></div>
<script>
const MANIFEST = {"miko": {"src": "./sprites/miko.svg?v=yomi1", "size": [2.25, 3.38], "anchor": [0.5, 0.04], "columns": 8, "rows": 2, "clips": {"idle": {"frames": [0, 0, 0, 1, 0, 0], "fps": 2}, "walk": {"frames": [2, 3, 4, 5], "fps": 9}, "attack": {"frames": [6, 7, 8], "fps": 10}, "gather": {"frames": [9, 10, 11, 10], "fps": 7}, "dash": {"frames": [12], "fps": 1}, "down": {"frames": [13], "fps": 1}}}, "daoshi-wanderer": {"src": "./sprites/daoshi-wanderer.svg?v=yomi1", "size": [2.25, 3.38], "anchor": [0.5, 0.04], "columns": 8, "rows": 2, "clips": {"idle": {"frames": [0, 0, 0, 1, 0, 0], "fps": 2}, "walk": {"frames": [2, 3, 4, 5], "fps": 9}, "attack": {"frames": [6, 7, 8], "fps": 10}, "gather": {"frames": [9, 10, 11, 10], "fps": 7}, "dash": {"frames": [12], "fps": 1}, "down": {"frames": [13], "fps": 1}}}, "chochin": {"src": "./sprites/chochin.svg?v=yomi1", "size": [2.0, 3.0], "anchor": [0.5, 0.04], "columns": 4, "rows": 2, "clips": {"idle": {"frames": [7], "fps": 1}, "walk": {"frames": [0, 1, 2, 3], "fps": 9}, "attack": {"frames": [4, 5, 6, 5], "fps": 6}}}, "jiangshi": {"src": "./sprites/jiangshi.svg?v=yomi1", "size": [2.5, 3.75], "anchor": [0.5, 0.04], "columns": 4, "rows": 2, "clips": {"idle": {"frames": [7], "fps": 1}, "walk": {"frames": [0, 1, 2, 3], "fps": 9}, "attack": {"frames": [4, 5, 6, 5], "fps": 6}}}, "kasa": {"src": "./sprites/kasa.svg?v=yomi1", "size": [2.0, 3.0], "anchor": [0.5, 0.04], "columns": 4, "rows": 2, "clips": {"idle": {"frames": [7], "fps": 1}, "walk": {"frames": [0, 1, 2, 3], "fps": 9}, "attack": {"frames": [4, 5, 6, 5], "fps": 6}}}, "rokurokubi": {"src": "./sprites/rokurokubi.svg?v=yomi1", "size": [2.7, 4.05], "anchor": [0.5, 0.04], "columns": 4, "rows": 2, "clips": {"idle": {"frames": [7], "fps": 1}, "walk": {"frames": [0, 1, 2, 3], "fps": 9}, "attack": {"frames": [4, 5, 6, 5], "fps": 6}}}, "yukionna": {"src": "./sprites/yukionna.svg?v=yomi1", "size": [2.4, 3.6], "anchor": [0.5, 0.04], "columns": 4, "rows": 2, "clips": {"idle": {"frames": [7], "fps": 1}, "walk": {"frames": [0, 1, 2, 3], "fps": 9}, "attack": {"frames": [4, 5, 6, 5], "fps": 6}}}, "daoshi": {"src": "./sprites/daoshi.svg?v=yomi1", "size": [2.4, 3.6], "anchor": [0.5, 0.04], "columns": 4, "rows": 2, "clips": {"idle": {"frames": [7], "fps": 1}, "walk": {"frames": [0, 1, 2, 3], "fps": 9}, "attack": {"frames": [4, 5, 6, 5], "fps": 6}}}, "sakura": {"src": "./sprites/sakura.svg?v=yomi1", "size": [4.92, 7.38], "anchor": [0.5, 0.04], "columns": 1, "rows": 1, "clips": {"idle": {"frames": [0], "fps": 1}}}, "matsu": {"src": "./sprites/matsu.svg?v=yomi1", "size": [4.92, 7.38], "anchor": [0.5, 0.04], "columns": 1, "rows": 1, "clips": {"idle": {"frames": [0], "fps": 1}}}, "toro": {"src": "./sprites/toro.svg?v=yomi1", "size": [1.9, 2.85], "anchor": [0.5, 0.04], "columns": 4, "rows": 1, "clips": {"idle": {"frames": [0, 1, 2, 3], "fps": 5}}}, "torii": {"src": "./sprites/torii.svg?v=yomi1", "size": [3.4, 5.1], "anchor": [0.5, 0.04], "columns": 1, "rows": 1, "clips": {"idle": {"frames": [0], "fps": 1}}}, "katana": {"src": "./sprites/katana.svg?v=yomi1", "size": [1.1, 1.65], "anchor": [0.5, 0.04], "columns": 1, "rows": 1, "clips": {"idle": {"frames": [0], "fps": 1}}, "icon": "./sprites/katana-icon.svg?v=yomi1"}, "guandao": {"src": "./sprites/guandao.svg?v=yomi1", "size": [1.1, 1.65], "anchor": [0.5, 0.04], "columns": 1, "rows": 1, "clips": {"idle": {"frames": [0], "fps": 1}}, "icon": "./sprites/guandao-icon.svg?v=yomi1"}, "yomi-rock": {"src": "./sprites/yomi-rock.svg?v=yomi1", "size": [2.8, 4.2], "anchor": [0.5, 0.04], "columns": 1, "rows": 1, "clips": {"idle": {"frames": [0], "fps": 1}}}, "yomi-rock-b": {"src": "./sprites/yomi-rock-b.svg?v=yomi1", "size": [2.8, 4.2], "anchor": [0.5, 0.04], "columns": 1, "rows": 1, "clips": {"idle": {"frames": [0], "fps": 1}}}, "jizo": {"src": "./sprites/jizo.svg?v=yomi1", "size": [1.5, 2.25], "anchor": [0.5, 0.04], "columns": 1, "rows": 1, "clips": {"idle": {"frames": [0], "fps": 1}}}};
const NAMES = {"miko": "Shrine maiden (wanderer)", "daoshi-wanderer": "Taoist exorcist (wanderer)", "daoshi": "Fallen daoshi (mob)", "kasa": "Kasa-obake, umbrella ghost (mob)", "rokurokubi": "Rokurokubi, long neck (mob)", "yukionna": "Yuki-onna, snow woman (mob)", "chochin": "Chochin-obake, lantern ghost (mob)", "jiangshi": "Jiangshi, hopping corpse (mob)", "sakura": "Old cherry (tree)", "matsu": "Sacred pine (tree)", "toro": "Stone lantern (decoration)", "torii": "Torii gate (decoration)", "katana": "Kagekiri, katana (weapon)", "guandao": "Dragon guandao (weapon)", "yomi-rock": "Garden stones (rock node)", "yomi-rock-b": "Sacred boulder (rock node)", "jizo": "Jizo statue (decoration)"};
const img = {};
for (const [k, s] of Object.entries(MANIFEST)) { img[k] = new Image(); img[k].src = s.src; }
function draw(ctx, k, frame, x, y, ppu, flip) {
  const s = MANIFEST[k], im = img[k]; if (!im.complete || !im.naturalWidth) return;
  const cw = im.naturalWidth / s.columns, ch = im.naturalHeight / s.rows;
  const w = s.size[0] * ppu, h = w * ch / cw;
  ctx.save(); ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
  ctx.drawImage(im, (frame % s.columns) * cw, Math.floor(frame / s.columns) * ch, cw, ch, -w * s.anchor[0], -h * (1 - s.anchor[1]), w, h);
  ctx.restore();
}
function frameOf(k, clip, t) { const c = MANIFEST[k].clips[clip] || MANIFEST[k].clips.idle; return c.frames[Math.floor(t * c.fps) % c.frames.length]; }
// cards: every sprite with its clips
const cards = [];
for (const k of Object.keys(MANIFEST)) {
  const s = MANIFEST[k], card = document.createElement('div'); card.className = 'card';
  const cv = document.createElement('canvas'); cv.width = 460; cv.height = 360;
  const chips = document.createElement('div'); chips.className = 'chips';
  const st = { k, cv, clip: s.clips.walk ? 'walk' : 'idle' };
  for (const c of Object.keys(s.clips)) {
    const b = document.createElement('button'); b.textContent = c; if (c === st.clip) b.className = 'on';
    b.onclick = () => { st.clip = c; chips.querySelectorAll('button').forEach(x => x.className = x === b ? 'on' : ''); };
    chips.append(b);
  }
  card.append(cv); const t = document.createElement('b'); t.textContent = NAMES[k] || k; card.append(t, chips);
  document.getElementById('grid').append(card); cards.push(st);
}
// stage: a little shrine path at night's edge
const stage = document.getElementById('stage'), sx = stage.getContext('2d');
const walkers = [
  { k: 'miko', x: 380, v: 70, min: 300, max: 760 }, { k: 'daoshi-wanderer', x: 640, v: -60, min: 420, max: 900 },
  { k: 'chochin', x: 980, v: -55, min: 820, max: 1130 }, { k: 'jiangshi', x: 90, v: 40, min: 40, max: 300 },
];
function loop(ms) {
  const t = ms / 1000;
  sx.clearRect(0, 0, stage.width, stage.height);
  sx.fillStyle = '#9c8968'; sx.fillRect(0, 380, stage.width, 18);
  const ppu = 52, y0 = 392;
  const props = [['matsu', 1110, 0], ['sakura', 150, 0], ['torii', 600, 0], ['toro', 470, frameOf('toro', 'idle', t)], ['toro', 730, frameOf('toro', 'idle', t + .3)]];
  for (const [k, x, fr] of props) draw(sx, k, fr, x, y0 - 30, ppu);
  for (const w of walkers) {
    w.x += w.v / 60; if (w.x > w.max || w.x < w.min) w.v *= -1;
    draw(sx, w.k, frameOf(w.k, 'walk', t + w.min), w.x, y0, ppu, w.v < 0);
  }
  for (const st of cards) {
    const c = st.cv.getContext('2d'); c.clearRect(0, 0, st.cv.width, st.cv.height);
    const s = MANIFEST[st.k], ppu2 = Math.min(110, 300 / s.size[1], 400 / s.size[0]);
    draw(c, st.k, frameOf(st.k, st.clip, t), 230, 340, ppu2);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
