<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Home</title>
    <link rel="stylesheet" href="css/style.css" />
    <script>
      if (location.hash === "#home" || location.hash === "#table") {
        location.replace("lobby/" + location.hash);
      }
    </script>
  </head>
  <body>
    <section class="page page-home">
      <div class="home-card">
        <h1>Home</h1>
        <p class="lede">Pick a page.</p>
        <div class="page-tiles">
          <a class="page-tile" href="lobby/">
            <span class="page-tile-title">Card table</span>
            <span class="page-tile-blurb">Host or join a lobby</span>
          </a>
          <a class="page-tile" href="fodinha/">
            <span class="page-tile-title">Fodinha</span>
            <span class="page-tile-blurb">Bid exactly the tricks you will take</span>
          </a>
          <a class="page-tile" href="presidente/">
            <span class="page-tile-title">Presidente</span>
            <span class="page-tile-blurb">Empty your hand. First out sits the throne</span>
          </a>
          <a class="page-tile" href="table-tennis/">
            <span class="page-tile-title">Table tennis</span>
            <span class="page-tile-blurb">Round-robin scores. Host edits, others watch</span>
          </a>
          <a class="page-tile" href="game-of-life/">
            <span class="page-tile-title">Game of Life</span>
            <span class="page-tile-blurb">Conway’s cellular automaton</span>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
