<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card lobby</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <p id="config-error" class="banner banner-error hidden"></p>

    <section id="view-home" class="page page-home">
      <div class="home-card">
        <h1>Card table</h1>
        <p class="lede">
          Host a room, share the code, then play at the table. The host keeps
          the deck.
        </p>

        <label class="field">
          Nickname
          <input id="nickname" type="text" maxlength="24" placeholder="Your name" autocomplete="nickname" />
        </label>

        <p class="field">Game</p>
        <div id="game-type" class="game-picks" role="listbox" aria-label="Game"></div>
        <p id="game-blurb" class="muted"></p>

        <div class="actions">
          <button id="btn-host" type="button">Host lobby</button>
        </div>
        <div id="resume-row" class="actions hidden">
          <button id="btn-resume" type="button">Resume room</button>
          <button id="btn-discard" type="button" class="ghost">Discard saved</button>
        </div>

        <div class="join-row">
          <label class="field grow">
            Room code
            <input id="join-code" type="text" maxlength="6" placeholder="ABC12" autocomplete="off" />
          </label>
          <button id="btn-join" type="button">Join</button>
        </div>

        <p id="home-status" class="status"></p>
      </div>
    </section>

    <section id="view-table" class="page page-table hidden">
      <header class="table-head">
        <div>
          <p class="muted" id="role-label"></p>
          <h2>Room <span id="room-code-display"></span></h2>
          <p class="muted" id="game-name-label"></p>
          <p class="muted">
            <span id="phase-label">lobby</span>
            · <span id="lobby-status" class="status"></span>
          </p>
        </div>
        <button id="btn-leave" type="button" class="ghost">Leave</button>
      </header>

      <div id="lobby-tools" class="table-toolbar">
        <div class="actions">
          <button id="btn-start" type="button">Start deal</button>
        </div>
      </div>

      <p id="round-message" class="round-message hidden"></p>
      <p id="turn-label" class="muted turn-label"></p>

      <div id="opponents" class="opponents"></div>

      <div id="layout-highcard" class="felt">
        <div class="felt-center">
          <div id="deck-pile" class="deck-pile" title="Draw pile"></div>
          <div>
            <p class="felt-label">Table</p>
            <div id="table-cards" class="card-row"></div>
          </div>
        </div>
      </div>

      <div id="layout-freeplay" class="felt hidden">
        <div class="felt-center zones">
          <div class="zone" data-space="deck">
            <p class="felt-label">Deck</p>
            <div id="fp-deck" class="deck-pile"></div>
          </div>
          <div class="zone" data-space="shared">
            <p class="felt-label">Shared</p>
            <div id="shared-cards" class="card-row"></div>
          </div>
          <div class="zone" data-space="discard">
            <p class="felt-label">Discard</p>
            <div id="discard-cards" class="card-row"></div>
          </div>
        </div>
        <div class="zone zone-mine">
          <p class="felt-label">Your space</p>
          <div id="my-personal" class="card-row"></div>
        </div>
      </div>

      <div id="freeplay-bar" class="action-bar hidden">
        <div id="player-actions" class="actions">
          <button type="button" data-act="place-shared">Place in shared</button>
          <button type="button" data-act="place-personal">Place in your space</button>
          <button type="button" data-act="place-discard">Place in discard</button>
          <button type="button" data-act="endTurn">End turn</button>
        </div>
      </div>

      <div class="you">
        <p class="felt-label">Your hand <span id="hand-hint" class="muted hidden">· tap to play</span></p>
        <div id="hand-cards" class="card-row"></div>
      </div>

      <div id="host-tools" class="host-tools hidden">
        <p class="felt-label">Host</p>
        <div class="actions">
          <button type="button" data-act="undo">Undo</button>
          <button type="button" data-act="startGame">Start game</button>
          <button type="button" data-act="shuffle">Shuffle deck</button>
          <button type="button" data-act="reshuffle">Reshuffle discard into deck</button>
          <button type="button" data-act="resetGame">Reset game</button>
        </div>
        <div class="actions">
          <input id="deal-count" type="number" min="1" max="52" value="5" class="num" />
          <select id="deal-target"></select>
          <button type="button" data-act="deal">Deal to player</button>
          <button type="button" data-act="dealAll">Deal to all</button>
        </div>
        <div class="actions">
          <input id="draw-count" type="number" min="1" max="52" value="1" class="num" />
          <button type="button" data-act="drawToShared">Flip from deck to shared</button>
        </div>
        <div class="actions">
          <select id="clear-target"></select>
          <button type="button" data-act="clearSpace">Discard whole space</button>
        </div>
        <p class="felt-label">Turn order</p>
        <ul id="order-list" class="order-list"></ul>
        <button type="button" data-act="setOrder">Apply order</button>
      </div>
    </section>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
