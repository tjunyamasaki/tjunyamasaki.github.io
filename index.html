<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card lobby</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <p id="config-error" class="banner banner-error hidden"></p>

    <section id="view-home" class="page page-home">
      <div class="home-card">
        <h1>Card table</h1>
        <p class="lede">
          Host a room, share the code, then play at the table. The host keeps
          the deck.
        </p>

        <label class="field">
          Nickname
          <input id="nickname" type="text" maxlength="24" placeholder="Your name" autocomplete="nickname" />
        </label>

        <label class="field">
          Game
          <select id="game-type"></select>
        </label>
        <p id="game-blurb" class="muted"></p>

        <div class="actions">
          <button id="btn-host" type="button">Host lobby</button>
        </div>
        <div id="resume-row" class="actions hidden">
          <button id="btn-resume" type="button">Resume room</button>
          <button id="btn-discard" type="button" class="ghost">Discard saved</button>
        </div>

        <div class="join-row">
          <label class="field grow">
            Room code
            <input id="join-code" type="text" maxlength="6" placeholder="ABC12" autocomplete="off" />
          </label>
          <button id="btn-join" type="button">Join</button>
        </div>

        <p id="home-status" class="status"></p>
      </div>
    </section>

    <section id="view-table" class="page page-table hidden">
      <header class="table-head">
        <div>
          <p class="muted" id="role-label"></p>
          <h2>Room <span id="room-code-display"></span></h2>
          <p class="muted" id="game-name-label"></p>
          <p class="muted">
            <span id="phase-label">lobby</span>
            · <span id="lobby-status" class="status"></span>
          </p>
        </div>
        <button id="btn-leave" type="button" class="ghost">Leave</button>
      </header>

      <div id="lobby-tools" class="table-toolbar">
        <span>Counter: <strong id="counter-value">0</strong></span>
        <div class="actions">
          <button id="btn-bump" type="button">Bump</button>
          <button id="btn-ready" type="button">Ready</button>
          <button id="btn-start" type="button">Start deal</button>
        </div>
      </div>

      <p id="round-message" class="round-message hidden"></p>

      <div id="opponents" class="opponents"></div>

      <div class="felt">
        <div class="felt-center">
          <div id="deck-pile" class="deck-pile" title="Draw pile"></div>
          <div>
            <p class="felt-label">Table</p>
            <div id="table-cards" class="card-row"></div>
          </div>
        </div>
      </div>

      <div class="you">
        <p class="felt-label">Your hand <span id="hand-hint" class="muted hidden">· tap to play</span></p>
        <div id="hand-cards" class="card-row"></div>
      </div>
    </section>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
