<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 70% 55% at 50% 42%, rgba(110, 231, 183, 0.14), transparent 58%),
          radial-gradient(ellipse 90% 80% at 50% 100%, rgba(24, 28, 38, 0.9), #07080c 70%),
          #0b0d12;
        color: #f3efe6;
      }

      .hello {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
        font-size: clamp(3.4rem, 14vw, 8.5rem);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 0.95;
        text-shadow: 0 0 48px rgba(110, 231, 183, 0.18);
        animation: rise 1.15s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.35em);
          filter: blur(8px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hello {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <p class="hello">Hello</p>
  </body>
</html>
