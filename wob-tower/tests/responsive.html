<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wobbly Tower — responsive check</title><style>body{margin:20px;background:#edf0f4;color:#263952;font:14px system-ui}label{display:block;margin:12px 0}iframe{display:block;border:1px solid #aab3c1;box-shadow:0 5px 30px #0002;background:#f5dfb2}select{font:inherit;padding:6px}</style><h1>Wobbly Tower responsive check</h1><label>Viewport <select id="viewport"><option value="390,844">Phone · 390 × 844</option><option value="360,640">Small phone · 360 × 640</option><option value="844,390">Landscape · 844 × 390</option><option value="1280,800">Desktop · 1280 × 800</option></select></label><iframe id="game" title="Wobbly Tower game" src="./index.html" width="390" height="844"></iframe><script>document.getElementById('viewport').onchange=e=>{const[w,h]=e.target.value.split(',');const game=document.getElementById('game');game.width=w;game.height=h;};</script></html>
